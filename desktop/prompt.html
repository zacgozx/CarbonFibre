<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
<title>CarbonFibre</title>
<style>
/* the plain theme's colours (carbonfibre-src/src/css/25-theme.css), light or dark as the app is */
:root { --bg: #1e1e22; --txt: #e4e4e7; --dim: #a1a1aa; --field: #18181b; --line: #3f3f46; --acc: #5b8def; --acc-ring: rgba(91, 141, 239, .35); color-scheme: dark; }
:root[data-theme="light"] { --bg: #f7f7f8; --txt: #18181b; --dim: #52525b; --field: #ffffff; --line: #d4d4d8; --acc: #2563eb; --acc-ring: rgba(37, 99, 235, .3); color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { padding: 18px 20px 16px; }
#msg { margin: 0 0 12px; white-space: pre-wrap; word-break: break-word; }
input { width: 100%; padding: 7px 9px; font: inherit; color: var(--txt); background: var(--field); border: 1px solid var(--line); border-radius: 6px; outline: none; }
input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-ring); }
.row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
button { font: inherit; padding: 5px 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--txt); cursor: pointer; }
button:hover { border-color: var(--dim); }
button[type="submit"] { background: var(--acc); border-color: var(--acc); color: #fff; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f">
  <p id="msg"></p>
  <input id="val" type="text" autocomplete="off" spellcheck="false" aria-labelledby="msg" />
  <div class="row">
    <button type="button" id="cancel">Cancel</button>
    <button type="submit">OK</button>
  </div>
</form>
<script src="prompt.js"></script>
</body>
</html>
