# Builds the desktop app (desktop/) for macOS, Windows and Linux on every push to main that changes the app, and publishes it as
# a GitHub Release named v1.0.<build number>. The website's "Get the app" links to the latest release, and
# installed apps update themselves from it (desktop/updater.js). The file names never change between
# releases, so .../releases/latest/download/<name> always means the newest:
#   CarbonFibre-mac-arm64.dmg / .zip, CarbonFibre-mac-x64.dmg / .zip       (.dmg to install, .zip to update)
#   CarbonFibre-win-x64-setup.exe, CarbonFibre-win-arm64-setup.exe
#   CarbonFibre-linux-x86_64.AppImage, CarbonFibre-linux-arm64.AppImage
# Nothing is signed (no Apple or Microsoft certificate). Run it by hand from the Actions tab too.
name: Desktop

on:
  push:
    branches: ["main"]
    # only what goes into the app: a push that changes only docs, tests or the website's built copy builds nothing
    paths:
      - "carbonfibre-src/src/**"
      - "carbonfibre-src/build.py"
      - "desktop/**"
      - "!desktop/**/*.md"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop
  cancel-in-progress: true          # a newer push replaces a build still running

env:
  VERSION: "1.0.${{ github.run_number }}"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15                # a stuck test fails the run instead of holding it
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
        with:
          persist-credentials: false   # no token left behind in .git
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38   # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Desktop tests (plugins, internet and Node.js permissions, updates)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          node build-page.js
          xvfb-run -a npx electron --no-sandbox test/run.js
          xvfb-run -a npx electron --no-sandbox test/node_test.js
          xvfb-run -a npx electron --no-sandbox test/db_test.js
          xvfb-run -a npx electron --no-sandbox test/popout_test.js
          xvfb-run -a npx electron --no-sandbox test/update_test.js

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
        with:
          persist-credentials: false   # no token left behind in .git
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38   # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version ${{ env.VERSION }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: node build-page.js

      - name: Linux (AppImage, x64 and arm64)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --x64 --arm64 --publish never
      - name: Windows (installer, x64 and arm64)
        if: runner.os == 'Windows'
        # one run per processor: both at once would make a single installer holding both
        run: |
          npx electron-builder --win nsis --x64 --publish never
          npx electron-builder --win nsis --arm64 --publish never
      # macOS: package, sign "ad hoc" (no certificate, but Apple silicon refuses an app with no signature at
      # all, and a broken one reads as "damaged"), then make the disk images and zips from the signed apps
      - name: macOS, package
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir --arm64 --x64 --publish never
      - name: macOS, ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          for a in dist/mac-arm64/CarbonFibre.app dist/mac/CarbonFibre.app; do
            codesign --force --deep --sign - "$a"
            codesign --verify --deep --strict "$a"
          done
      - name: macOS, disk images and zips
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dmg zip --arm64 --prepackaged dist/mac-arm64/CarbonFibre.app --publish never
          npx electron-builder --mac dmg zip --x64 --prepackaged dist/mac/CarbonFibre.app --publish never

      - name: The files the website and the updater expect
        run: |
          case "$RUNNER_OS" in
            Linux)   want="CarbonFibre-linux-x86_64.AppImage CarbonFibre-linux-arm64.AppImage" ;;
            Windows) want="CarbonFibre-win-x64-setup.exe CarbonFibre-win-arm64-setup.exe" ;;
            macOS)   want="CarbonFibre-mac-arm64.dmg CarbonFibre-mac-x64.dmg CarbonFibre-mac-arm64.zip CarbonFibre-mac-x64.zip" ;;
          esac
          mkdir -p out
          for f in $want; do test -f "dist/$f" || { echo "missing dist/$f"; ls dist; exit 1; }; cp "dist/$f" out/; done
          ls -la out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: carbonfibre-${{ runner.os }}
          path: desktop/out/*
          retention-days: 3
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                # only this job can publish
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ env.VERSION }} as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ls -la out
          printf 'Built from %s\n\n%s\n' "${GITHUB_SHA::7}" "${MSG:-manual build}" > notes.md
          gh release create "v$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CarbonFibre $VERSION" --notes-file notes.md --latest
