# Rebuilds the app from carbonfibre-src/ and publishes public/ to GitHub Pages.
name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the app from source
        run: |
          python carbonfibre-src/build.py public/index.html
          python carbonfibre-src/build.py --check public/index.html
      - uses: actions/configure-pages@v5
      - name: Upload public/ only
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
